name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Paths
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses and Install NDK
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" "cmake;3.28.0" "build-tools;35.0.0"

      - name: Grant Execute Permissions
        run: |
          chmod +x ./build_gamelib.sh
          chmod +x ./android/gradlew
          chmod +x ./android/build_apk.sh
          chmod +x ./android/sign_apk.sh

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Sign & Align Release APK
        run: |
          ./android/sign_apk.sh \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            SMO-Recomp-v0.1.0-android-arm64.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SMO-Recomp-v0.1.0-android-arm64
          path: SMO-Recomp-v0.1.0-android-arm64.apk

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SMO-Recomp-v0.1.0-android-arm64.apk
          generate_release_notes: true
          draft: false
          prerelease: false
